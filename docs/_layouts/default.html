<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — Rating Helper{% else %}Документы — Rating Helper{% endif %}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <meta name="theme-color" content="#f6f6f4">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="page">
    <header class="site-header">
      <a class="brand" href="index.html">Rating Helper</a>
      <span class="brand-sub">Калькулятор БРС</span>
    </header>

    {% unless page.hide_back %}
    <nav class="crumbs" aria-label="Навигация">
      <a href="index.html">← Все документы</a>
    </nav>
    {% endunless %}

    <article class="doc">
      {{ content }}
    </article>

    <footer class="site-footer">
      <p>Rating Helper — неофициальный студенческий проект. Не является продуктом учебного заведения.</p>
      <p><a href="https://github.com/Van228337/ratinghelperextension/issues">Обратная связь</a> · <a href="index.html">Документы</a></p>
    </footer>
  </main>
</body>
</html>
